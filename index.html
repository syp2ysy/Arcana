<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2024+ MLLM/VLM/LMM Visual Reasoning Audit</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: #18212b;
      background: #f7f9fb;
    }
    main {
      max-width: 720px;
      padding: 28px;
      border: 1px solid #d8e0e7;
      border-radius: 8px;
      background: white;
      box-shadow: 0 1px 3px rgba(16, 40, 58, 0.08);
    }
    code { background: #edf3f6; border-radius: 4px; padding: 1px 4px; }
  </style>
</head>
<body>
  <main>
    <h1>正在打开审计报告</h1>
    <p>页面会自动展开完整 HTML 报告。如果浏览器停在这里，请换用最新版 Chrome、Edge、Safari 或 Firefox。</p>
    <p id="status">Loading...</p>
  </main>
  <script>
    const chunkFiles = ["payload-00.txt", "payload-01.txt", "payload-02.txt", "payload-03.txt", "payload-04.txt", "payload-05.txt", "payload-06.txt", "payload-07.txt", "payload-08.txt", "payload-09.txt", "payload-10.txt", "payload-11.txt", "payload-12.txt", "payload-13.txt", "payload-14.txt", "payload-15.txt"];
    async function loadReport() {
      if (!("DecompressionStream" in window)) {
        document.getElementById("status").textContent = "当前浏览器不支持 DecompressionStream，无法自动展开压缩报告。";
        return;
      }
      const pieces = await Promise.all(chunkFiles.map(async (name) => {
        const response = await fetch(name, { cache: "no-store" });
        if (!response.ok) throw new Error(name + " " + response.status);
        return response.text();
      }));
      const payload = pieces.join("").replace(/\s+/g, "");
      const binary = atob(payload);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    }
    loadReport().catch((error) => {
      document.getElementById("status").textContent = "报告加载失败: " + error.message;
    });
  </script>
</body>
</html>
